<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chef — Chatbot Cuisine</title>
  <link rel="stylesheet" href="mini_projetCSS.css">
</head>
<body>
  <div id="app-container">
        <div id="header">
            <h2>🌸 ChefBot - Assistant Cuisine Douceur</h2>
            <p>✨ Recettes tunisiennes & internationales dans une ambiance pastel</p>
        </div>
        
        <div id="features-bar">
            <div class="feature-tag" onclick="quickSearch('recette rapide')">
                ⚡ Rapide
            </div>
            <div class="feature-tag" onclick="quickSearch('tunisien traditionnel')">
                🇹🇳 Traditionnel
            </div>
            <div class="feature-tag" onclick="quickSearch('végétarien')">
                🥬 Végétarien
            </div>
            <div class="feature-tag" onclick="quickSearch('dessert sucré')">
                🍰 Dessert
            </div>
            <div class="feature-tag" onclick="quickSearch('petit déjeuner')">
                🌅 Petit-déj
            </div>
            <div class="feature-tag" onclick="quickSearch('astuce cuisine')">
                💡 Astuce
            </div>
        </div>
        
        <div id="chat-area">
            <div id="msgs"></div>
            <div class="typing-indicator" id="typing">ChefBot réfléchit doucement...</div>
        </div>
        
        <div id="input-area">
            <button class="btn btn-secondary" onclick="showSuggestions()" title="Suggestions">
                💫
            </button>
            <input type="text" id="inp" placeholder="Partage tes envies culinaires..." 
                   onkeypress="if(event.key==='Enter') send()">
            <button class="btn btn-primary" onclick="send()">
                Envoyer ✨
            </button>
        </div>
    </div>

<script>
        const msgs = document.getElementById('msgs');
        const inp = document.getElementById('inp');
        const typing = document.getElementById('typing');

        const recipes = [
            {
                id: 1, name: "Couscous Tunisien Royal", difficulty: "difficile", time: 120,
                ingredients: ["semoule", "agneau", "pois chiches", "tomates", "oignons", "harissa", "épices"],
                steps: [
                    "Prépare la semoule à la vapeur (3 fois)",
                    "Fais revenir l'agneau avec oignons et épices",
                    "Ajoute tomates, concentré et pois chiches",
                    "Laisse mijoter 1h30 à feu doux",
                    "Sers avec harissa et huile d'olive"
                ]
            },
            {
                id: 2, name: "Ojja Merguez Express", difficulty: "facile", time: 15,
                ingredients: ["merguez", "oeufs", "tomates", "poivrons", "ail", "harissa"],
                steps: [
                    "Coupe et fais revenir la merguez 3 min",
                    "Ajoute tomates et poivrons émincés",
                    "Laisse cuire 8 min à feu moyen",
                    "Casse les œufs dessus, couvre 4 min",
                    "Sers avec du pain"
                ]
            },
            {
                id: 3, name: "Lablabi Réconfortant", difficulty: "facile", time: 20,
                ingredients: ["pois chiches", "pain rassis", "oeuf", "thon", "harissa", "cumin"],
                steps: [
                    "Chauffe les pois chiches avec leur eau",
                    "Coupe le pain en morceaux dans un bol",
                    "Verse les pois chiches chauds sur le pain",
                    "Ajoute œuf poché, thon, câpres",
                    "Assaisonne harissa, cumin, huile d'olive"
                ]
            },
            {
                id: 4, name: "Brik à l'œuf", difficulty: "moyen", time: 15,
                ingredients: ["feuilles de brick", "oeuf", "thon", "câpres", "persil"],
                steps: [
                    "Dispose la feuille de brick en losange",
                    "Mets thon, câpres, persil au centre",
                    "Casse un œuf par-dessus",
                    "Plie en triangle",
                    "Fais frire 2-3 min de chaque côté"
                ]
            },
            {
                id: 5, name: "Mloukhia Traditionnelle", difficulty: "difficile", time: 240,
                ingredients: ["poudre de mloukhia", "agneau", "huile d'olive", "ail", "laurier"],
                steps: [
                    "Fais revenir l'agneau dans l'huile",
                    "Dilue la poudre de mloukhia progressivement",
                    "Ajoute l'eau chaude et les épices",
                    "Laisse mijoter 3-4h à feu doux",
                    "Sers avec du pain français"
                ]
            },
            {
                id: 6, name: "Salade Mechouia", difficulty: "moyen", time: 30,
                ingredients: ["poivrons", "tomates", "oignons", "thon", "olives", "oeufs"],
                steps: [
                    "Grille poivrons et tomates au four 20 min",
                    "Pèle et écrase à la fourchette",
                    "Ajoute thon, olives, câpres",
                    "Assaisonne huile d'olive, citron, cumin",
                    "Décore avec œufs durs"
                ]
            },
            {
                id: 7, name: "Kafteji", difficulty: "moyen", time: 30,
                ingredients: ["courgettes", "poivrons", "pommes de terre", "tomates", "oeufs"],
                steps: [
                    "Fais frire chaque légume en dés séparément",
                    "Égoutte sur papier absorbant",
                    "Mélange tous les légumes",
                    "Ajoute tomates fraîches en dés",
                    "Sers avec œufs durs et citron"
                ]
            },
            {
                id: 8, name: "Poulet Curry Coco", difficulty: "facile", time: 25,
                ingredients: ["poulet", "lait de coco", "curry", "oignons", "riz"],
                steps: [
                    "Fais revenir poulet et oignons 5 min",
                    "Ajoute curry",
                    "Verse le lait de coco, mijote 15 min",
                    "Sers avec du riz"
                ]
            }
        ];

        function findRecipes(query) {
            const q = query.toLowerCase();
            return recipes.filter(r => {
                return r.ingredients.some(i => q.includes(i)) || 
                       r.name.toLowerCase().includes(q) ||
                       r.ingredients.some(i => i.includes(q));
            });
        }

        function addBubble(text, role, suggestions = null) {
            const div = document.createElement('div');
            div.className = 'bubble ' + role;
            div.innerHTML = text.replace(/\n/g, '<br>');
            
            if (suggestions) {
                const chipsDiv = document.createElement('div');
                chipsDiv.className = 'suggestion-chips';
                suggestions.forEach(sug => {
                    const chip = document.createElement('span');
                    chip.className = 'suggestion-chip';
                    chip.textContent = sug;
                    chip.onclick = () => { inp.value = sug; send(); };
                    chipsDiv.appendChild(chip);
                });
                div.appendChild(chipsDiv);
            }
            
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function formatRecipe(recipe) {
            let html = `<b style="font-size:1.1em;">${recipe.name}</b><br>`;
            html += `<span class="difficulty ${recipe.difficulty}">${recipe.difficulty}</span> ⏱️ ${recipe.time} min<br><br>`;
            html += `<b>Ingrédients :</b><br>${recipe.ingredients.join(', ')}<br><br>`;
            html += `<b>Préparation :</b><br>`;
            recipe.steps.forEach((step, i) => { html += `${i+1}. ${step}<br>`; });
            return html;
        }

        function send() {
            const text = inp.value.trim();
            if (!text) return;
            
            addBubble(text, 'user');
            inp.value = '';
            
            typing.classList.add('active');
            
            setTimeout(() => {
                typing.classList.remove('active');
                
                const found = findRecipes(text);
                
                if (found.length > 0) {
                    if (found.length === 1) {
                        addBubble(formatRecipe(found[0]), 'bot', ['Autre recette', 'Recette rapide', 'Cuisine tunisienne']);
                    } else {
                        let response = `<b>${found.length} recettes trouvées :</b><br><br>`;
                        found.forEach((r, i) => {
                            response += `<b>${i+1}. ${r.name}</b> - ${r.difficulty} - ${r.time} min<br>`;
                        });
                        response += '<br>Laquelle veux-tu ?';
                        addBubble(response, 'bot', found.map(r => r.name));
                    }
                } else {
                    addBubble("Aucune recette trouvée. Essaie avec un ingrédient (poulet, oeuf, thon, merguez...)", 'bot', 
                        ["Couscous", "Ojja", "Brik", "Lablabi", "Mechouia"]);
                }
            }, 500 + Math.random() * 800);
        }

        window.onload = () => {
            addBubble("<b>Donne-moi un ingrédient ou un type de recette</b>", 'bot', 
                ["Poulet", "Oeuf", "Merguez", "Recette rapide", "Cuisine tunisienne"]);
        };
</script>
</body>
</html
