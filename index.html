<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chef Karim — Chatbot Cuisine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-wrap">
    <div class="header">
      <span>👨‍🍳</span>
      <h1>Chef </h1>
    </div>
    <div class="messages" id="msgs">
      <div class="bubble bot">Bonjour ! Je suis le Chef. Qu'est-ce qu'on cuisine aujourd'hui ? 🍽️</div>
    </div>
    <div class="input-area">
      <input id="inp" type="text" placeholder="Posez votre question..." onkeydown="if(event.key==='Enter') send()"/>
      <button onclick="send()">Envoyer</button>
    </div>
  </div>
  <script >

    const history = [];

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';

  addBubble(text, 'user');
  history.push({ role: 'user', content: text });

  const typing = addBubble('...', 'bot');

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: "Tu es Chef Karim, un chef cuisinier passionné. Réponds toujours en français, avec des conseils pratiques et des emojis culinaires.",
      messages: history
    })
  });

  const data = await res.json();
  const reply = data.content[0].text;
  history.push({ role: 'assistant', content: reply });
  typing.textContent = reply;
}

function addBubble(text, role) {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}
  </script>
</body>
</html>
