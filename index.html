<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chef Karim — Chatbot Cuisine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-wrap">
    <div class="header">
      <span>👨‍🍳</span>
      <h1>Chef </h1>
    </div>
    <div class="messages" id="msgs">
      <div class="bubble bot">Bonjour ! Je suis le Chef. Qu'est-ce qu'on cuisine aujourd'hui ? 🍽️</div>
    </div>
    <div class="input-area">
      <input id="inp" type="text" placeholder="Posez votre question..." onkeydown="if(event.key==='Enter') send()"/>
      <button onclick="send()">Envoyer</button>
    </div>
  </div>
  <script >

const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');

async function send() {
  const text = inp.value.trim();
  if (!text) return;

  // 1. Afficher le message de l'utilisateur
  addBubble(text, 'user');
  inp.value = '';

  // 2. Afficher la bulle de chargement "..."
  const typing = addBubble('...', 'bot');

  try {
    // 3. Envoyer la requête à ton serveur Flask (app.py)
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    // 4. Remplacer les "..." par la réponse réelle du Chef
    if (data.response) {
      typing.textContent = data.response;
    } else {
      typing.textContent = "Désolé, j'ai rencontré une erreur.";
    }
  } catch (error) {
    typing.textContent = "Erreur de connexion au serveur.";
    console.error("Erreur:", error);
  }
}

function addBubble(text, role) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}
  </script>
</body>
</html>
